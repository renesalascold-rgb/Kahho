<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración de Preguntas</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
    h2, h3 { color: #46178f; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, select, button { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .opt-grid input { margin-bottom: 0; }
    .color-rojo { border-left: 5px solid #e21b3c; }
    .color-azul { border-left: 5px solid #1368ce; }
    .color-amarillo { border-left: 5px solid #d89e00; }
    .color-verde { border-left: 5px solid #26890c; }
    button[type="submit"] { background-color: #26890c; color: white; font-weight: bold; cursor: pointer; border: none; transition: background 0.3s; }
    button[type="submit"]:hover { background-color: #1e6b0a; }
    .q-item { border: 1px solid #ddd; background: #fafafa; padding: 15px; margin-top: 10px; border-radius: 6px; }
    .btn-delete { background-color: #e21b3c; color: white; width: auto; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; float: right; }
    .btn-delete:hover { background-color: #b5152f; }
    .alert { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Agregar Nueva Pregunta</h2>
    <div id="statusMsg" class="alert"></div>
    <form id="qForm">
      <label><b>Pregunta:</b></label>
      <input type="text" id="question" placeholder="Escribe la pregunta aquí..." required autocomplete="off" />
      
      <label><b>Opciones de respuesta:</b></label>
      <div class="opt-grid">
        <input type="text" id="opt0" class="color-rojo" placeholder="Opción Roja (1)" required autocomplete="off" />
        <input type="text" id="opt1" class="color-azul" placeholder="Opción Azul (2)" required autocomplete="off" />
        <input type="text" id="opt2" class="color-amarillo" placeholder="Opción Amarilla (3)" required autocomplete="off" />
        <input type="text" id="opt3" class="color-verde" placeholder="Opción Verde (4)" required autocomplete="off" />
      </div>
      <br>

      <label><b>¿Cuál es la respuesta correcta?</b></label>
      <select id="correctIndex" required>
        <option value="" disabled selected>Selecciona una opción...</option>
        <option value="0">Opción Roja (1)</option>
        <option value="1">Opción Azul (2)</option>
        <option value="2">Opción Amarilla (3)</option>
        <option value="3">Opción Verde (4)</option>
      </select>

      <label><b>Tiempo límite (segundos):</b></label>
      <input type="number" id="timeLimit" value="20" min="5" max="120" required />

      <button type="submit">Guardar Pregunta en el Banco</button>
    </form>
  </div>

  <div class="card">
    <h3>Banco de Preguntas</h3>
    <div id="questionsList">Cargando preguntas...</div>
  </div>

  <script>
    const statusMsg = document.getElementById('statusMsg');
    const questionsList = document.getElementById('questionsList');

    function showStatus(message, isError = false) {
      statusMsg.textContent = message;
      statusMsg.className = isError ? 'alert alert-error' : 'alert alert-success';
      statusMsg.style.display = 'block';
      setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
    }

    async function loadQuestions() {
      try {
        const response = await fetch('/api/questions');
        if (!response.ok) throw new Error('Error al cargar');
        const list = await response.json();
        
        if (list.length === 0) {
          questionsList.innerHTML = '<p style="color: #666;">No hay preguntas guardadas aún. ¡Agrega la primera!</p>';
          return;
        }

        questionsList.innerHTML = '';
        list.forEach((q, index) => {
          questionsList.innerHTML += `
            <div class="q-item">
              <button class="btn-delete" onclick="deleteQuestion('${q.id}')">Eliminar</button>
              <strong>Pregunta ${index + 1}: ${q.question}</strong> 
              <span style="color:#666; font-size: 0.9em;">(${q.timeLimit} segundos)</span><br><br>
              <div style="font-size: 0.9em;">
                🔴 ${q.options[0]} <br>
                🔵 ${q.options[1]} <br>
                🟡 ${q.options[2]} <br>
                🟢 ${q.options[3]}
              </div>
              <p style="color: green; margin-bottom: 0;"><b>Respuesta correcta: Opción ${q.correctIndex + 1}</b></p>
            </div>
          `;
        });
      } catch (error) {
        questionsList.innerHTML = '<p style="color: red;">Error de conexión. Asegúrate de que el servidor esté corriendo.</p>';
        console.error(error);
      }
    }

    document.getElementById('qForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        question: document.getElementById('question').value,
        options: [
          document.getElementById('opt0').value,
          document.getElementById('opt1').value,
          document.getElementById('opt2').value,
          document.getElementById('opt3').value
        ],
        correctIndex: document.getElementById('correctIndex').value,
        timeLimit: document.getElementById('timeLimit').value
      };

      try {
        const response = await fetch('/api/questions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          showStatus('¡Pregunta guardada con éxito!');
          document.getElementById('qForm').reset();
          document.getElementById('correctIndex').value = ""; // Resetear select
          loadQuestions();
        } else {
          const data = await response.json();
          showStatus(data.error || 'Error al guardar.', true);
        }
      } catch (error) {
        showStatus('Error de conexión.', true);
        console.error(error);
      }
    });

    async function deleteQuestion(id) {
      if(confirm('¿Estás seguro de eliminar esta pregunta?')) {
         try {
            await fetch('/api/questions/' + id, { method: 'DELETE' });
            loadQuestions();
         } catch(error) {
            alert("Error al eliminar");
         }
      }
    }

    // Cargar preguntas al inicio
    loadQuestions();
  </script>
</body>
</html>
