<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>Kahoot - Alumno</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Estilos base para celular */
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f2f2f2; display: flex; flex-direction: column; height: 100vh; overflow: hidden;}
    
    /* Contenedores */
    .view-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; }
    
    /* Login */
    #loginView { background: #33106a; color: white; }
    .form-box { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .form-box h2 { color: #333; margin-top: 0; text-align: center; }
    input { width: 100%; padding: 15px; margin-bottom: 15px; font-size: 1.1rem; border-radius: 4px; border: 1px solid #ccc; background: #f9f9f9; text-align: center; font-weight: bold;}
    input#pin { font-size: 1.5rem; letter-spacing: 2px; }
    button.btn-join { width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.btn-join:active { background: #000; }

    /* Mensajes de Estado */
    #waitView, #feedbackView { background: #46178f; color: white; text-align: center; }
    .status-icon { font-size: 5rem; margin-bottom: 20px; }
    .status-text { font-size: 1.8rem; font-weight: bold; }
    
    /* Botones de Juego (Pantalla Dividida en 4) */
    #gameButtonsView { padding: 0; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; gap: 5px; padding: 5px; }
    .k-btn { border: none; border-radius: 8px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -5px rgba(0,0,0,0.2); }
    .k-btn:active { box-shadow: inset 0 0 rgba(0,0,0,0); transform: translateY(5px); }
    
    /* Símbolos e íconos más grandes */
    .k-btn svg { width: 40%; height: 40%; fill: white; }
    
    .c-red { background-color: #e21b3c; }
    .c-blue { background-color: #1368ce; }
    .c-yellow { background-color: #d89e00; }
    .c-green { background-color: #26890c; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: LOGIN -->
  <div class="view-container" id="loginView">
    <div class="form-box">
      <h2>Ingresar</h2>
      <input type="number" id="pin" placeholder="PIN del juego" required autocomplete="off">
      <input type="text" id="paterno" placeholder="Apellido Paterno" required autocomplete="off" style="text-transform: capitalize;">
      <input type="text" id="materno" placeholder="Apellido Materno" required autocomplete="off" style="text-transform: capitalize;">
      <input type="text" id="nombre" placeholder="Nombre(s)" required autocomplete="off" style="text-transform: capitalize;">
      <button class="btn-join" onclick="joinGame()">Entrar</button>
    </div>
  </div>

  <!-- PANTALLA 2: ESPERA -->
  <div class="view-container" id="waitView" style="display:none;">
    <div class="status-text" id="welcomeMsg">¡Estás dentro!</div>
    <p style="font-size: 1.2rem; margin-top: 20px;">Ves tu nombre en la pantalla?</p>
  </div>

  <!-- PANTALLA 3: BOTONES PARA RESPONDER -->
  <div class="view-container" id="gameButtonsView" style="display:none;">
    <div class="btn-grid">
      <!-- Usamos SVG para que los iconos de kahoot escalen perfecto -->
      <button class="k-btn c-red" onclick="sendAnswer(0)">
        <svg viewBox="0 0 32 32"><path d="M16 4 L2 28 L30 28 Z"/></svg>
      </button>
      <button class="k-btn c-blue" onclick="sendAnswer(1)">
        <svg viewBox="0 0 32 32"><path d="M16 2 L30 16 L16 30 L2 16 Z"/></svg>
      </button>
      <button class="k-btn c-yellow" onclick="sendAnswer(2)">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/></svg>
      </button>
      <button class="k-btn c-green" onclick="sendAnswer(3)">
        <svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24"/></svg>
      </button>
    </div>
  </div>

  <!-- PANTALLA 4: RETROALIMENTACIÓN -->
  <div class="view-container" id="feedbackView" style="display:none;">
    <div class="status-icon" id="fbIcon">⏳</div>
    <div class="status-text" id="feedbackMsg">Esperando a que todos contesten...</div>
  </div>

  <script>
    const socket = io();
    let currentPin = '';

    function switchView(viewId) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('waitView').style.display = 'none';
      document.getElementById('gameButtonsView').style.display = 'none';
      document.getElementById('feedbackView').style.display = 'none';
      document.getElementById(viewId).style.display = 'flex';
    }

    function joinGame() {
      const pin = document.getElementById('pin').value.trim();
      const paterno = document.getElementById('paterno').value.trim();
      const materno = document.getElementById('materno').value.trim();
      const nombre = document.getElementById('nombre').value.trim();

      if (!pin || !paterno || !materno || !nombre) {
        return alert('Por favor llena todos los campos.');
      }
      currentPin = pin;
      socket.emit('join-room', { pin, paterno, materno, nombre });
    }

    socket.on('join-error', (msg) => {
      alert(msg);
      document.getElementById('pin').value = '';
    });

    socket.on('joined-success', ({ fullName }) => {
      switchView('waitView');
      document.getElementById('welcomeMsg').innerText = `¡Listo,\n${fullName}!`;
    });

    // Cuando el presentador lanza la pregunta
    socket.on('show-question-player', () => {
      switchView('gameButtonsView');
    });

    function sendAnswer(index) {
      switchView('feedbackView');
      document.getElementById('fbIcon').innerText = '⏳';
      document.getElementById('feedbackMsg').innerText = 'Respuesta enviada.\nEsperando a los demás...';
      
      socket.emit('submit-answer', { pin: currentPin, optionIndex: index });
    }

    socket.on('answer-recorded', ({ isCorrect }) => {
      // Opcional: Podríamos mostrar si acertó de inmediato, o esperar.
      // En Kahoot suele esperar a que acabe el tiempo. 
      // Por ahora lo guardamos en memoria y lo mostramos cuando el host termine la pregunta.
    });

    socket.on('show-round-results', () => {
      // Cuando se acaba el tiempo, mostramos que miren al frente
      switchView('feedbackView');
      document.getElementById('fbIcon').innerText = '👀';
      document.getElementById('feedbackMsg').innerText = '¡Tiempo agotado!\nMira la pantalla del proyector.';
    });

    socket.on('game-over', () => {
      switchView('feedbackView');
      document.getElementById('fbIcon').innerText = '🏆';
      document.getElementById('feedbackMsg').innerText = '¡Fin del juego!\nRevisa el podio en la pantalla principal.';
    });

    socket.on('room-closed', () => {
      alert("El profesor cerró la sala.");
      window.location.reload();
    });
  </script>
</body>
</html>
